apis:
- aid: svn:svn-c-api
  name: SVN C Library API
  description: >-
    The Subversion C library provides the low-level API for building tools and integrations. It includes
    the libsvn_client, libsvn_ra, libsvn_wc, and libsvn_repos libraries for client operations, repository
    access, working copy management, and server-side repository access respectively.
  humanURL: https://subversion.apache.org/docs/api/latest/
  tags:
  - C Library
  - Integration
  - Library
  properties:
  - type: Documentation
    url: https://subversion.apache.org/docs/api/latest/
  - type: GitHubRepository
    url: https://github.com/apache/subversion
- aid: svn:svn-python-bindings
  name: SVN Python Bindings
  description: >-
    Python bindings for Subversion C libraries, providing access to client and repository operations via
    pysvn and the official svn.client Python module.
  humanURL: https://pysvn.sourceforge.io/
  tags:
  - Python
  - SDK
  properties:
  - type: Documentation
    url: https://pysvn.sourceforge.io/Docs/pysvn_prog_guide.html
- aid: svn:svn-java-bindings
  name: SVNKit Java Library
  description: >-
    SVNKit is a pure Java Subversion client library providing full access to Subversion repository and
    working copy data. Used by major IDE plugins including IntelliJ IDEA and Eclipse Subclipse.
  humanURL: https://svnkit.com/
  tags:
